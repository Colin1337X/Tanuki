[package]
name = "tanuki-app"
version = "1.0.0"
description = "Tanuki Stories secure server-connected client"
authors = ["Tanuki Team"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "tanuki_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
url = "2.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
