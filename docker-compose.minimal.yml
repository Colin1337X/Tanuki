services:
  app:
    build:
      context: .
      target: production
    env_file: .env.local
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      TANUKI_DATA_DIR: /app/data
      TANUKI_KEYRING_FILE: /run/secrets/tanuki-keyring.json
    ports:
      - "127.0.0.1:${TANUKI_PORT:-3000}:3000"
    volumes:
      - tanuki-data:/app/data
      - ./.secrets/production-keyring.json:/run/secrets/tanuki-keyring.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    mem_limit: 1g
    pids_limit: 128
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  tanuki-data:
