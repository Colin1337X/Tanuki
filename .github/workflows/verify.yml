name: Verify application and isolation
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: npm
      - name: Audit application and isolated worker dependencies
        run: |
          npm audit --audit-level=low
          npm audit --prefix worker --audit-level=low
      - run: npm ci
      - name: Prepare signed Ubuntu package sources
        run: bash scripts/ci/ubuntu-packages.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Full application and browser coverage
        run: |
          set -o pipefail
          mkdir -p coverage
          npm run test:coverage | tee coverage/full-suite.log
          npm run coverage:report
      - name: Runtime and installed-profile regression
        run: |
          node --test scripts/security-runtime.test.js
          node --test scripts/release/smoke.test.mjs
      - name: Production-only dependency smoke
        shell: bash
        run: |
          set -euo pipefail
          fixture=$(mktemp -d)
          cp -r server public scripts package.json package-lock.json "$fixture/"
          cd "$fixture"
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          node --test scripts/production-smoke.test.js
      - name: Read-only non-root container acceptance
        shell: bash
        run: |
          set -euo pipefail
          docker build --target production -t tanuki-production .
          docker build --target validation -t tanuki-validation .
          docker run --rm --read-only --tmpfs /tmp:rw,nosuid,nodev,size=256m --cap-drop ALL --security-opt no-new-privileges --memory 1g --pids-limit 128 tanuki-validation
      - name: Enforced worker identity and systemd isolation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-worker.mjs "$RUNNER_TEMP/worker-artifact"
          sudo useradd --system --user-group --no-create-home --shell /usr/sbin/nologin tanuki-ci-worker
          worker_uid=$(id -u tanuki-ci-worker)
          sudo env TANUKI_NODE="$(command -v node)" bash scripts/security/run-worker-isolation.sh "$RUNNER_TEMP/worker-artifact" "$worker_uid" "$(id -u)"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: verification-evidence
          path: |
            coverage/full-suite.log
            coverage/report.html
            coverage/summary.json
            coverage/lcov.info
            coverage/installer-*.png
          retention-days: 14
