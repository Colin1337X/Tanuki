name: Legacy native mobile regression
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install reviewed Gradle
        run: |
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.14.6-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          echo "7988ed071b2a07900e2ec715fca15c6ab72bce6db433af301fa7fa7e9407bd24  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.14.6/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.13.1
      - name: Resolve and audit Android dependency graph
        run: |
          gradle -p mobile/android --no-daemon dependencyInventory
          node scripts/security/audit-inventory.mjs mobile/android/build/dependency-inventory.json mobile/android/build/dependency-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-dependency-evidence
          path: mobile/android/build/dependency-*.json
          if-no-files-found: warn
      - name: Test URL authorization policy
        working-directory: mobile/android
        run: |
          mkdir -p build/policy
          javac -d build/policy app/src/main/java/org/tanuki/stories/OriginPolicy.java OriginPolicyTest.java
          java -cp build/policy OriginPolicyTest
      - name: Build and lint Android client
        working-directory: mobile/android
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease :app:lintRelease
      - name: Verify debug APK signature and collect candidates
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose mobile/android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p mobile/android/build/artifacts
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mobile/android/build/artifacts/Tanuki-Android-test.apk
          cp mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk mobile/android/build/artifacts/Tanuki-Android-release-unsigned.apk
          cd mobile/android/build/artifacts
          sha256sum ./*.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-android-candidates
          path: |
            mobile/android/build/artifacts/*
            mobile/android/build/dependency-inventory.json
            mobile/android/build/dependency-audit.json
          if-no-files-found: error
  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test URL authorization policy
        working-directory: mobile/ios
        run: |
          mkdir -p build
          xcrun clang -fobjc-arc -framework Foundation Tanuki/OriginPolicy.m OriginPolicyTests.m -o build/origin-tests
          build/origin-tests
      - name: Build simulator app and unsigned device archive
        working-directory: mobile/ios
        run: |
          xcodebuild -project Tanuki.xcodeproj -scheme Tanuki -configuration Debug -sdk iphonesimulator -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project Tanuki.xcodeproj -scheme Tanuki -configuration Release -destination 'generic/platform=iOS' -archivePath build/Tanuki.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - name: Package unsigned IPA for signing review
        working-directory: mobile/ios
        run: |
          mkdir -p build/ipa/Payload build/artifacts
          cp -R build/Tanuki.xcarchive/Products/Applications/Tanuki.app build/ipa/Payload/
          (cd build/ipa && zip -qr ../artifacts/Tanuki-iOS-UNSIGNED.ipa Payload)
          ditto -c -k --keepParent build/Tanuki.xcarchive build/artifacts/Tanuki-iOS-archive.zip
          ditto -c -k --keepParent build/simulator/Build/Products/Debug-iphonesimulator/Tanuki.app build/artifacts/Tanuki-iOS-simulator.zip
          printf '%s\n' 'UNSIGNED IPA: not installable on a physical iPhone. Use export-signed.sh with your Apple signing identity and provisioning profile. No App Store or TestFlight submission has occurred.' > build/artifacts/READ-ME.txt
          (cd build/artifacts && shasum -a 256 ./*.ipa ./*.zip > SHA256SUMS.txt)
      - name: Launch installed iOS simulator client
        working-directory: mobile/ios
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" build/simulator/Build/Products/Debug-iphonesimulator/Tanuki.app
          xcrun simctl launch "$device" org.tanuki.stories
          sleep 3
          xcrun simctl spawn "$device" launchctl list | grep org.tanuki.stories
          xcrun simctl io "$device" screenshot build/artifacts/ios-server-picker.png
          xcrun simctl shutdown "$device"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-ios-candidates
          path: mobile/ios/build/artifacts/*
          if-no-files-found: error
